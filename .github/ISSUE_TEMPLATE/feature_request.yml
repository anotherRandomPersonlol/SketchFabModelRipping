name: Feature request
description: Ask for a new feature or a change to an existing feature.
title: "[Feature] <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: Tell what you want to do and why the current script does not do it.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Example model link (optional)
      placeholder: https://sketchfab.com/3d-models/...
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution (optional)
